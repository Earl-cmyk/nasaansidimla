<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Earl{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <nav class="topbar">
            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-icon" aria-label="Dashboard">📌</a>
                <a href="{{ url_for('calendar') }}" class="nav-icon" aria-label="Calendar">📅</a>
                <a href="{{ url_for('notes') }}" class="nav-icon" aria-label="Notes">📝</a>
                <a href="{{ url_for('fitness') }}" class="nav-icon" aria-label="Fitness">💪</a>
                <a href="{{ url_for('workbench') }}" class="nav-icon" aria-label="Workbench">✍️</a>
                <a href="{{ url_for('works') }}" class="nav-icon" aria-label="Works">🗂️</a>
                <a href="{{ url_for('wallets') }}" class="nav-icon" aria-label="Wallets">💰</a>
            </div>

            <div class="search-wrap">
                <input type="text" id="search-input" placeholder="Search with Rick...">
                <button id="search-button" class="primary-button" type="button">🔍</button>
            </div>

            <button id="assistant-toggle" class="nav-icon" title="Open assistant" aria-label="Open assistant" aria-expanded="false" aria-controls="assistant-drawer">💬</button>
        </nav>

        <div id="search-results" class="search-results" aria-live="polite" role="dialog" aria-label="Rick search results" hidden>
            <button id="search-close" class="search-close" type="button" aria-label="Close search results">✕</button>
            <div id="search-results-content"></div>
        </div>

        <main class="page-shell">
            {% block content %}{% endblock %}
        </main>

        <aside id="assistant-drawer" class="assistant-drawer" aria-label="Rick assistant" aria-hidden="true">
            <div class="assistant-header">
                <h3>Rick</h3>
                <button id="assistant-close" class="ghost-button" type="button">✕</button>
            </div>

            <div id="assistant-history" class="assistant-history">
                <p class="assistant-note">Welcome back. Ask for a reminder, note search, calendar update, or a summary of your week.</p>
            </div>

            <form id="assistant-form" method="POST" action="{{ url_for('assistant_message') }}">
                <input type="text" name="message" placeholder="Ask Rick anything..." autocomplete="off">
                <button type="submit" class="primary-button">🎯</button>
            </form>
        </aside>

        <script>
            const searchButton = document.getElementById('search-button');
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const searchClose = document.getElementById('search-close');
            const searchResultsContent = document.getElementById('search-results-content');
            const assistantForm = document.getElementById('assistant-form');
            const assistantHistory = document.getElementById('assistant-history');
            const assistantToggle = document.getElementById('assistant-toggle');
            const assistantDrawer = document.getElementById('assistant-drawer');
            const assistantClose = document.getElementById('assistant-close');

            // Assistant drawer toggle
            assistantToggle.addEventListener('click', () => {
                assistantDrawer.classList.toggle('open');
                const isOpen = assistantDrawer.classList.contains('open');
                assistantToggle.setAttribute('aria-expanded', String(isOpen));
                assistantDrawer.setAttribute('aria-hidden', String(!isOpen));
            });

            assistantClose.addEventListener('click', () => {
                assistantDrawer.classList.remove('open');
                assistantToggle.setAttribute('aria-expanded', 'false');
                assistantDrawer.setAttribute('aria-hidden', 'true');
            });

            async function handleSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    searchResultsContent.innerHTML = '<p class="search-empty">Type something to search with Rick.</p>';
                    searchResults.hidden = false;
                    return;
                }

                searchResultsContent.innerHTML = '<p class="search-empty">Searching...</p>';
                searchResults.hidden = false;
                try {
                    const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                    if (!response.ok) throw new Error('Search request failed');
                    const data = await response.json();

                    if (!data.results || data.results.length === 0) {
                        searchResultsContent.innerHTML = '<p class="search-empty">No results found.</p>';
                        return;
                    }

                    searchResultsContent.innerHTML = '';
                    data.results.forEach((item) => {
                        const card = document.createElement('article');
                        card.className = 'result-card';
                        const title = document.createElement('h4');
                        title.textContent = item.title || 'Untitled result';
                        const link = document.createElement('a');
                        link.href = item.url || '#';
                        link.target = '_blank';
                        link.rel = 'noreferrer';
                        link.textContent = item.url || '';
                        const snippet = document.createElement('p');
                        snippet.textContent = item.snippet || '';
                        card.append(title, link, snippet);
                        searchResultsContent.appendChild(card);
                    });
                } catch (error) {
                    searchResultsContent.innerHTML = '<p class="search-empty">Rick could not complete that search.</p>';
                }
            }

            searchClose.addEventListener('click', () => {
                searchResults.hidden = true;
            });

            searchButton.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    handleSearch();
                }
            });

            document.addEventListener('click', (event) => {
                if (!searchResults.contains(event.target) && !searchInput.contains(event.target) && !searchButton.contains(event.target)) {
                    searchResults.hidden = true;
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') searchResults.hidden = true;
            });

            assistantForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const formData = new FormData(assistantForm);
                const message = formData.get('message')?.toString().trim();

                if (!message) {
                    return;
                }

                const messageNode = document.createElement('p');
                messageNode.className = 'assistant-message user';
                messageNode.textContent = message;
                assistantHistory.appendChild(messageNode);

                const response = await fetch('/assistant-message', {
                    method: 'POST',
                    body: formData,
                });
                const payload = await response.json();

                const replyNode = document.createElement('p');
                replyNode.className = 'assistant-message rick';
                replyNode.textContent = payload.reply;
                assistantHistory.appendChild(replyNode);
                assistantForm.reset();
                assistantHistory.scrollTop = assistantHistory.scrollHeight;
            });
        </script>
    </body>
</html>
