{% extends "base.html" %}
{% block title %}Earl - Notes{% endblock %}

{% block content %}
<section class="page-panel">
    <header class="section-header">
        <div>
            <p class="eyebrow">memory</p>
            <h1>Notes</h1>
        </div>
        <button id="add-note-btn" class="primary-button" type="button">+ Add note</button>
    </header>

    <div id="notes-feed" class="notes-feed">
        <div class="card card-empty">
            <p class="empty-state">No notes yet. Click "Add note" to get started.</p>
        </div>
    </div>
</section>

<!-- Add/Edit Note Modal -->
<div id="note-modal" class="modal note-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="note-modal-title">New note</h2>
            <button id="note-modal-close" class="ghost-button" type="button">✕</button>
        </div>
        <div class="modal-body">
            <form id="note-form">
                <label>
                    <span>Title</span>
                    <input type="text" id="note-title" placeholder="Title of your note" required>
                </label>
                <label>
                    <span>Content</span>
                    <div class="editor-toolbar" role="toolbar" aria-label="Note formatting">
                        <button type="button" data-mark="**" title="Bold"><strong>B</strong></button>
                        <button type="button" data-mark="*" title="Italic"><em>I</em></button>
                        <button type="button" data-mark="<u>" data-close="</u>" title="Underline"><u>U</u></button>
                        <button type="button" data-mark="==" title="Highlight">Highlight</button>
                        <button type="button" data-prefix="# " title="Heading">H</button>
                        <button type="button" data-prefix="- " title="Bullet list">•</button>
                        <button type="button" data-prefix="1. " title="Numbered list">1.</button>
                        <button type="button" id="note-link-btn" title="Insert hyperlink">Link</button>
                        <button type="button" id="note-table-btn" title="Insert table">Table</button>
                        <select id="note-font-size" title="Font size">
                            <option value="">Size</option><option value="small">Small</option><option value="large">Large</option>
                        </select>
                        <select id="note-font-family" title="Font family">
                            <option value="">Font</option><option value="serif">Serif</option><option value="sans-serif">Sans</option><option value="monospace">Mono</option>
                        </select>
                        <button type="button" id="note-emoji-btn" title="Insert emoji">😀</button>
                    </div>
                    <textarea id="note-content" rows="12" placeholder="Write your thought... Tabs, spaces, and blank lines are preserved."></textarea>
                    <div class="editor-preview-label">Preview</div>
                    <div id="note-preview" class="note-editor-preview" aria-live="polite"></div>
                </label>
                <label>
                    <span>Tag</span>
                    <input type="text" id="note-tag" placeholder="e.g., Idea vault, Research, Personal">
                </label>
                <div class="form-actions">
                    <button type="submit" class="primary-button">Save note</button>
                    <button type="button" id="note-delete-btn" class="ghost-button" style="display: none;">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Note Detail Modal -->
<div id="note-detail-modal" class="modal note-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="detail-title">Note</h2>
            <button id="detail-modal-close" class="ghost-button" type="button">✕</button>
        </div>
        <div class="modal-body">
            <div id="detail-content" class="note-detail-content"></div>
            <div class="detail-actions">
                <button id="detail-edit-btn" class="secondary-button" type="button">Edit</button>
                <button id="detail-close-btn" class="ghost-button" type="button">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    const addNoteBtn = document.getElementById('add-note-btn');
    const noteModal = document.getElementById('note-modal');
    const noteModalClose = document.getElementById('note-modal-close');
    const detailModal = document.getElementById('note-detail-modal');
    const detailModalClose = document.getElementById('detail-modal-close');
    const noteForm = document.getElementById('note-form');
    const noteTitle = document.getElementById('note-title');
    const noteContent = document.getElementById('note-content');
    const noteTag = document.getElementById('note-tag');
    const noteDeleteBtn = document.getElementById('note-delete-btn');
    const detailEditBtn = document.getElementById('detail-edit-btn');
    const detailCloseBtn = document.getElementById('detail-close-btn');
    const notesFeed = document.getElementById('notes-feed');
    let currentNoteId = null;
    let currentNote = null;

    // Open add note modal
    addNoteBtn.addEventListener('click', () => {
        currentNoteId = null;
        currentNote = null;
        noteForm.reset();
        notePreview.innerHTML = '';
        noteDeleteBtn.style.display = 'none';
        document.getElementById('note-modal-title').textContent = 'New note';
        noteModal.classList.add('open');
    });

    // Close modals
    [noteModalClose, detailModalClose].forEach(btn => {
        btn.addEventListener('click', () => {
            noteModal.classList.remove('open');
            detailModal.classList.remove('open');
        });
    });

    [noteModal, detailModal].forEach(modal => {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('open');
            }
        });
    });

    async function loadNotes() {
        const response = await fetch('/api/notes');
        const notes = await response.json();
        notesFeed.innerHTML = '';

        if (!notes.length) {
            notesFeed.innerHTML = '<div class="card card-empty"><p class="empty-state">No notes yet. Click "Add note" to get started.</p></div>';
            return;
        }

        notes.forEach((note) => {
            const noteCard = document.createElement('div');
            noteCard.className = 'feed-card card';
            noteCard.dataset.id = note.id;
            noteCard.dataset.title = note.title;
            noteCard.dataset.content = note.content;
            noteCard.dataset.html = note.html || '';
            noteCard.dataset.tag = note.tag || 'Note';

            noteCard.innerHTML = `
                <div class="card-header">
                    <span>${note.tag || 'Note'}</span>
                    <span class="note-date">${new Date(note.created_at).toLocaleDateString()}</span>
                </div>
                <h3>${note.title}</h3>
                <p class="note-excerpt">${(note.content || '').substring(0, 140)}${(note.content || '').length > 140 ? '...' : ''}</p>
            `;

            noteCard.addEventListener('click', () => {
                currentNoteId = noteCard.dataset.id;
                currentNote = note;
                detailModal.classList.add('open');
                document.getElementById('detail-title').textContent = note.title;
                document.getElementById('detail-content').innerHTML = `<div class="note-detail"><span class="detail-tag">${note.tag || 'Note'}</span><div class="rich-content">${note.html || ''}</div></div>`;
            });

            notesFeed.appendChild(noteCard);
        });
    }

    noteForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = noteTitle.value.trim();
        const content = noteContent.value;
        const tag = noteTag.value.trim() || 'Note';

        if (!title) {
            alert('Please enter a title');
            return;
        }

        const response = await fetch(currentNoteId ? `/api/notes/${currentNoteId}` : '/api/notes', {
            method: currentNoteId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content, tag }),
        });

        if (response.ok) {
            noteModal.classList.remove('open');
            noteForm.reset();
            await loadNotes();
        }
    });

    detailEditBtn.addEventListener('click', () => {
        if (!currentNoteId) return;
        const noteToEdit = Array.from(notesFeed.children).find((card) => card.dataset.id === String(currentNoteId));
        if (!noteToEdit) return;

        noteTitle.value = noteToEdit.dataset.title;
        noteContent.value = noteToEdit.dataset.content;
        notePreview.innerHTML = noteToEdit.dataset.html || '';
        noteTag.value = noteToEdit.dataset.tag || 'Note';
        noteDeleteBtn.style.display = 'inline-block';
        noteDeleteBtn.onclick = async () => {
            const response = await fetch(`/api/notes/${currentNoteId}`, { method: 'DELETE' });
            if (response.ok) {
                noteModal.classList.remove('open');
                detailModal.classList.remove('open');
                await loadNotes();
            }
        };
        document.getElementById('note-modal-title').textContent = 'Edit note';
        detailModal.classList.remove('open');
        noteModal.classList.add('open');
    });

    detailCloseBtn.addEventListener('click', () => {
        detailModal.classList.remove('open');
    });

    loadNotes();

    const notePreview = document.getElementById('note-preview');
    function refreshNotePreview() {
        notePreview.textContent = noteContent.value;
    }
    noteContent.addEventListener('input', refreshNotePreview);

    function wrapSelection(open, close = open) {
        const start = noteContent.selectionStart;
        const end = noteContent.selectionEnd;
        const selected = noteContent.value.slice(start, end) || 'text';
        noteContent.setRangeText(`${open}${selected}${close}`, start, end, 'end');
        refreshNotePreview();
        noteContent.focus();
    }

    document.querySelectorAll('[data-mark]').forEach((button) => {
        button.addEventListener('click', () => wrapSelection(button.dataset.mark, button.dataset.close || button.dataset.mark));
    });
    document.querySelectorAll('[data-prefix]').forEach((button) => {
        button.addEventListener('click', () => {
            const start = noteContent.selectionStart;
            noteContent.setRangeText(button.dataset.prefix, start, start, 'end');
            refreshNotePreview();
            noteContent.focus();
        });
    });
    document.getElementById('note-link-btn').addEventListener('click', () => {
        const url = prompt('Link URL');
        if (url) wrapSelection('[', `](${url})`);
    });
    document.getElementById('note-table-btn').addEventListener('click', () => {
        const table = '| Column 1 | Column 2 |\n| --- | --- |\n| Value | Value |';
        const start = noteContent.selectionStart;
        noteContent.setRangeText(table, start, start, 'end');
        refreshNotePreview();
    });
    document.getElementById('note-emoji-btn').addEventListener('click', () => wrapSelection('😀', ''));
    document.getElementById('note-font-size').addEventListener('change', (event) => {
        if (event.target.value) wrapSelection(`<span style="font-size:${event.target.value === 'small' ? '0.85rem' : '1.35rem'}">`, '</span>');
        event.target.value = '';
    });
    document.getElementById('note-font-family').addEventListener('change', (event) => {
        if (event.target.value) wrapSelection(`<span style="font-family:${event.target.value}">`, '</span>');
        event.target.value = '';
    });
</script>
{% endblock %}
